<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Searchbar</title>
    <link rel="stylesheet" href="././style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div>
        <div id="radioContainer">
            <div class="radio-item">
                <input type="radio" name="options" id="Autocomplete" value="Autocomplete" checked>
                <label for="Autocomplete">Autocomplete</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="options" id="Synonyms" value="Synonyms">
                <label for="Synonyms">Synonyms</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="options" id="Extend" value="Extend">
                <label for="Extend">Extend</label>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Enter keyword(s)" autocomplete="off" />
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="suggestion-wrap">
                <ul class="suggestions">
                </ul>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="././app.js"></script>
</body>
</html>
